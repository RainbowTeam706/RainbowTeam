server:
  port: 8080
spring:
  application:
    name: pq
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pq?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
    password:
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.pq.entity # 别名扫描包
  configuration:
    map-underscore-to-camel-case: false
logging:
  level:
    com.pq: debug

# 豆包AI配置
doubao:
  api:
    key: 1a251fe4-5fbf-4171-bb2a-dcd01f2e7e81  # 直接设置，不使用环境变量
    url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
  model: doubao-seed-2-0-pro-260215

ai:
  engine:
    preprocess-truncate-threshold: 1000
    long-term-max-items: 5
    rag-top-k: 3
    vector-dims: 128
    memory-min-text-length: 30
    memory-min-sentence-count: 3
